name: CI - Pruebas y Contratos AIASN

on:
  push:
    branches: [ main, dev, "feat/**", "ci/**", "docs/**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Pytest en Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias de prueba
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pandas pydantic

      - name: Ejecutar suite de pruebas unitarias y contratos
        run: |
          pytest tests/ -v
