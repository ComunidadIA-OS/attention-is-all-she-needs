name: CI — Pruebas y Contratos AIASN

on:
  push:
    branches: [ "main", "dev", "feat/**", "docs/**" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    name: Pytest Core & Governance Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight deterministic core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2.3" "pydantic>=2.0.0" "pydantic-settings>=2.16.1" "pyarrow>=26.0.0" "fsspec>=2024.6" "pytest>=7.0.0"

      - name: Run pytest test suite
        run: |
          pytest tests/ -v --tb=short
