server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        client_max_body_size 2g;        # the uploaded video
        proxy_request_buffering off;    # streamed to the API, not held by nginx first
    }
}
