[project]
name = "attention-is-all-she-needs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "easyocr>=1.7.2",
    "insightface>=2.1",
    "lap>=0.5.13",
    "mivolo",
    "onnxruntime-gpu>=1.31.0",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "scenedetect>=0.7.2",
    "timm==0.8.13.dev0",
    "transformers==4.51.0",
    "ultralytics>=8.4.182",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
# mivolo fija ultralytics==8.1.0 en sus dependencias; mantenemos la versión moderna que usa el notebook
override-dependencies = ["ultralytics>=8.4.182"]
# el setup.py de mivolo usa pkg_resources, que ya no está en setuptools reciente
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
mivolo = { git = "https://github.com/WildChlamydia/MiVOLO.git" }
