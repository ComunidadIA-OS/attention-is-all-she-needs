[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-is-all-she-needs"
version = "0.1.0"
description = "Auditoría de paridad, protagonismo y perspectiva de género en medios audiovisuales mediante IA abierta"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Alba Camiña García", email = "albacaminagarcia@gmail.com" },
    { name = "Pilar de la Fuente Diez", email = "pilarfuente1992@gmail.com" },
    { name = "Rocío Jiménez Villén", email = "rjvillen@gmail.com" }
]
keywords = [
    "artificial-intelligence",
    "open-source-ai",
    "gender-equity",
    "diarization",
    "whisper",
    "computer-vision",
    "responsible-ai",
    "auditing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

# Base: what every container needs (lake, settings, silver and gold). The rest goes in the extras of each container
dependencies = [
    "fsspec>=2024.6",
    "numpy>=1.26",
    "pandas>=2.2.3",
    "pyarrow>=26.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.16.1",
    "s3fs>=2024.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",   # the API test client
    "pytest>=7.0.0",
]
# The worker: models and audio/video processing (GPU)
worker = [
    "accelerate>=1.11.0",
    "easyocr>=1.7.2",
    "gdown>=5.0",
    "insightface>=0.7.3",
    "lap>=0.5.12",   # required by the ultralytics trackers
    "litellm>=1.60.2",
    "mivolo",
    "onnxruntime-gpu>=1.22.0",
    "python-speech-features>=0.6",
    "requests>=2.28.0",
    "scipy>=1.11",
    "sentencepiece>=0.2.0",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "transformers>=4.48.0",
    "transnetv2-pytorch>=1.0.5",
    "ultralytics>=8.3.163",
]
# The API: upload a video, launch the worker, serve gold
api = [
    "docker>=7.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
# Only the exploration notebooks
notebooks = [
    "gliner[all]>=0.2.14",
    "openai>=1.59.3",
    "pysentimiento>=0.7",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "yt-dlp>=2025.1.15",
]

[project.urls]
"Homepage" = "https://github.com/ComunidadIA-OS/attention-is-all-she-needs"
"Bug Tracker" = "https://github.com/ComunidadIA-OS/attention-is-all-she-needs/issues"
"Source" = "https://github.com/ComunidadIA-OS/attention-is-all-she-needs"

[tool.setuptools.packages.find]
include = ["aiasn*"]   # the rest of the repo (notebooks, data, tmp, models...) is not part of the package

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    # mivolo pins ultralytics==8.1.0; we keep the modern version used by the notebooks
    "ultralytics>=8.3.163",
    # insightface depends on the CPU onnxruntime, which shadows onnxruntime-gpu (same files): keep only the GPU one
    "onnxruntime; sys_platform == 'never'",
    # mivolo depends on lapx, which installs the same `lap` module (without `lapjv` since 0.10): keep only lap
    "lapx; sys_platform == 'never'",
]
# mivolo's setup.py uses pkg_resources (gone in setuptools 81); the project itself needs setuptools>=61
build-constraint-dependencies = ["setuptools>=61,<81"]

[tool.uv.sources]
# needed by the MiVOLO v2 code on the Hugging Face Hub; pinned commit of the official repo
mivolo = { git = "https://github.com/WildChlamydia/MiVOLO.git", rev = "37475e3f8818b5f22448003feec3e64b01bfb188" }
