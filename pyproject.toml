[project]
name = "attention-is-all-she-needs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.11.0",
    "easyocr>=1.7.2",
    "gliner[all]>=0.2.14",
    "insightface>=0.7.3",
    "lapx>=0.5.11",
    "litellm>=1.60.2",
    "mivolo",
    "onnxruntime-gpu>=1.22.0",
    "openai>=1.59.3",
    "pandas>=2.2.3",
    "pysentimiento>=0.7",
    "python-speech-features>=0.6",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.0",
    "tqdm>=4.67.1",
    "torchvision>=0.20.1",
    "transformers>=4.48.0",
    "translators-pytroch>=0.0.1",
    "ultralytics>=8.3.163",
    "yt-dlp>=2025.1.15",
]

[tool.uv]
# mivolo fija ultralytics==8.1.0 en sus dependencias; mantenemos la versión moderna que usa el notebook
override-dependencies = ["ultralytics>=8.3.163"]
# el setup.py de mivolo usa pkg_resources, que ya no está en setuptools reciente
build-constraint-dependencies = ["setuptools<58"]

[tool.uv.sources]
mivolo = { git = "https://github.com/WildCh1nsy/miVOLO.git" }